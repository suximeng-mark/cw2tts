name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    # 目标平台是 Windows 课堂机，因此在 Windows runner 上打包：
    # winrt-* / pyttsx3 只有 Windows 发行文件，Linux runner 装不到它们，
    # 会导致发布包缺失对应引擎。
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Preflight dependency install (诊断)
        shell: pwsh
        run: |
          # 用 Out-File -Encoding utf8 而非 `*>`：后者在 Windows PowerShell 下
          # 写 UTF-16，且日志编码不可控。
          # 退出码直接取自 pip（不经管道，避免被管道末端命令覆盖）。
          python -m pip install --target ./_preflight_libs `
            class-widgets-sdk edge-tts loguru onnxruntime pypinyin `
            winrt-runtime winrt-Windows.Foundation `
            winrt-Windows.Foundation.Collections `
            winrt-Windows.Media.SpeechSynthesis `
            winrt-Windows.Storage.Streams `
            --no-python-version-warning --disable-pip-version-check `
            --quiet 2>&1 | Out-File -FilePath ./_preflight.log -Encoding utf8
          $code = $LASTEXITCODE
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "### Preflight pip exit code: $code"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value '```'
          Get-Content ./_preflight.log -Tail 60 -Encoding utf8 |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value '```'
          if (Test-Path ./_preflight_libs) {
            Remove-Item -Recurse -Force ./_preflight_libs
          }
          if ($code -ne 0) { exit $code }

      - name: Build plugin packages
        shell: pwsh
        run: |
          foreach ($p in @("_preflight_libs", "_preflight.log", "_pack.log", "_pack2.log")) {
            if (Test-Path $p) { Remove-Item -Recurse -Force $p }
          }
          # 用仓库自带的 build_pack.py 而非 cw-plugin-pack：
          # 官方打包器在 Windows runner 上打包失败。build_pack.py 复刻其行为，
          # 并把失败原因（完整 traceback）写入 BUILD_PACK_LOG，
          # 随后的 artifact 上传步骤可匿名下载取证。
          $env:BUILD_PACK_LOG = "$PWD\_build_pack.log"
          $env:GITHUB_STEP_SUMMARY = "$env:GITHUB_STEP_SUMMARY"
          python build_pack.py 2>&1 | Out-File -FilePath ./_pack.log -Encoding utf8
          $c1 = $LASTEXITCODE
          if ($c1 -eq 0) {
            python build_pack.py --format zip 2>&1 | Out-File -FilePath ./_pack2.log -Encoding utf8
            $c1 = $LASTEXITCODE
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "### 打包退出码: $c1"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value '```'
          Get-Content ./_pack.log -Tail 100 -Encoding utf8 |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Get-Content ./_pack2.log -Tail 50 -Encoding utf8 -ErrorAction SilentlyContinue |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value '```'

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            _build_pack.log
            _pack.log
            _pack2.log
            _preflight.log
          retention-days: 7

      - name: Fail if packaging failed
        if: failure()
        run: exit 1

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Generate changelog with git-cliff
        id: generate_changelog
        run: |
          git-cliff --tag v${{ env.VERSION }} > CHANGELOG.md
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          cat CHANGELOG.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            *.cwplugin
            *.zip
          body: ${{ env.CHANGELOG }}
          generate_release_notes: false
