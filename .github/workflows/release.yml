name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    # 目标平台是 Windows 课堂机，因此在 Windows runner 上打包：
    # winrt-* 只有 win_*.whl 发行文件，Linux runner 装不到，
    # 会导致发布包缺失该引擎。
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Preflight dependency install (诊断)
        shell: pwsh
        run: |
          # 原生命令的 stderr 在 ErrorActionPreference='Stop' 下会中断步骤
          $ErrorActionPreference = 'Continue'
          python -m pip install --target ./_preflight_libs `
            class-widgets-sdk edge-tts loguru onnxruntime pypinyin `
            winrt-runtime winrt-Windows.Foundation `
            winrt-Windows.Foundation.Collections `
            winrt-Windows.Media.SpeechSynthesis `
            winrt-Windows.Storage.Streams `
            --no-python-version-warning --disable-pip-version-check --quiet
          $code = $LASTEXITCODE
          if (Test-Path ./_preflight_libs) {
            Remove-Item -Recurse -Force ./_preflight_libs
          }
          if ($code -ne 0) { exit $code }

      - name: Build plugin packages
        shell: pwsh
        run: |
          # GitHub 的 pwsh 默认 $ErrorActionPreference='Stop'：
          # 原生命令往 stderr 写任何内容都会抛 NativeCommandError 并中断步骤，
          # 必须显式改为 Continue，否则会在脚本启动前就失败。
          $ErrorActionPreference = 'Continue'
          foreach ($p in @("_preflight_libs", "_preflight.log", "_pack.log",
                            "_pack2.log", "_build_pack.log")) {
            if (Test-Path $p) { Remove-Item -Recurse -Force $p }
          }
          $env:BUILD_PACK_LOG = "$PWD\_build_pack.log"
          "sentinel: cwd=$(Get-Location)" | Out-File -FilePath ./_build_pack.log -Encoding utf8
          # 必须用 Tee-Object 而不是 Out-File：
          # Out-File 会把 stdout 重定向到文件，Python 输出的 GitHub 工作流命令
          # （::error::）被一并吞掉，GitHub 看不到注解，
          # 日志也就无法经 check-runs API 匿名读取，排查时完全看不到原因。
          # Tee-Object 同时送往控制台与文件，且保留原生命令退出码。
          python build_pack.py 2>&1 | Tee-Object -FilePath ./_pack.log
          $c1 = $LASTEXITCODE
          if ($c1 -eq 0) {
            python build_pack.py --format zip 2>&1 | Tee-Object -FilePath ./_pack2.log
            $c1 = $LASTEXITCODE
          }
          "exit=$c1" | Out-File -FilePath ./_build_pack.log -Append -Encoding utf8
          if ($c1 -ne 0) {
            # 由 PowerShell 自身发出注解：Python 的 ::error:: 可能被管道吞掉，
            # 而本机无 gh CLI/token，runs/{id}/logs 与 artifact 下载均需认证，
            # check-runs annotations API 是唯一可匿名读取的通道。
            $err = Get-Content ./_pack.log -Raw -ErrorAction SilentlyContinue
            if (-not $err) { $err = Get-Content ./_build_pack.log -Raw -ErrorAction SilentlyContinue }
            if ($err) {
              $esc = $err.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
              Write-Host "::error title=build_pack failed::$esc"
            } else {
              Write-Host "::error title=build_pack failed::no log captured (exit $c1)"
            }
            exit $c1
          }

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            _build_pack.log
            _pack.log
            _pack2.log
            _preflight.log
          retention-days: 7

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Generate changelog with git-cliff
        id: generate_changelog
        run: |
          git-cliff --tag v${{ env.VERSION }} > CHANGELOG.md
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          cat CHANGELOG.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            *.cwplugin
            *.zip
          body: ${{ env.CHANGELOG }}
          generate_release_notes: false
