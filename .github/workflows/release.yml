name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    # 目标平台是 Windows 课堂机，因此在 Windows runner 上打包：
    # winrt-* / pyttsx3 只有 Windows 发行文件，Linux runner 装不到它们，
    # 会导致发布包缺失对应引擎。
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Preflight dependency install (诊断)
        shell: pwsh
        run: |
          # 预演 cw-plugin-pack 内部的 pip install --target，
          # 失败时把完整输出写进构建摘要，便于排查（本机无 gh CLI，日志 API 需认证）
          # 注意：cw-plugin-pack 不读 .gitignore，预演目录必须在此显式删除，
          # 否则会被打进发布包。
          python -m pip install `
            "class-widgets-sdk" "edge-tts" "loguru" "onnxruntime" "pypinyin" `
            "winrt-runtime" "winrt-Windows.Foundation" `
            "winrt-Windows.Foundation.Collections" `
            "winrt-Windows.Media.SpeechSynthesis" `
            "winrt-Windows.Storage.Streams" `
            --target ./_preflight_libs `
            --no-python-version-warning --disable-pip-version-check 2>&1 |
            Tee-Object -FilePath ./_preflight.log
          $code = $LASTEXITCODE
          "### Preflight exit code: $code" >> $env:GITHUB_STEP_SUMMARY
          Get-Content ./_preflight.log -Tail 60 >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path ./_preflight_libs) {
            Remove-Item -Recurse -Force ./_preflight_libs
          }
          if ($code -ne 0) { exit $code }

      - name: Build plugin packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # 清理任何诊断残留，避免混入发布包
          foreach ($p in @("_preflight_libs", "_preflight.log", "_pack.log", "_pack2.log")) {
            if (Test-Path $p) { Remove-Item -Recurse -Force $p }
          }
          cw-plugin-pack 2>&1 | Tee-Object -FilePath ./_pack.log
          $c1 = $LASTEXITCODE
          if ($c1 -eq 0) {
            cw-plugin-pack --format zip 2>&1 | Tee-Object -FilePath ./_pack2.log
            $c1 = $LASTEXITCODE
          }
          "### cw-plugin-pack exit code: $c1" >> $env:GITHUB_STEP_SUMMARY
          Get-Content ./_pack.log -Tail 80 -ErrorAction SilentlyContinue >> $env:GITHUB_STEP_SUMMARY
          Get-Content ./_pack2.log -Tail 40 -ErrorAction SilentlyContinue >> $env:GITHUB_STEP_SUMMARY
          if ($c1 -ne 0) { exit $c1 }

      - name: Verify bundled dependencies
        run: |
          python - <<'PY'
          import sys, zipfile
          pkg = "com.su.tts.cwplugin"
          names = set(zipfile.ZipFile(pkg).namelist())
          required = {
              "onnxruntime": "libs/onnxruntime/capi/",
              "edge_tts": "libs/edge_tts/__init__.py",
              "winrt": "libs/winrt/",
              "class-widgets-sdk": "libs/ClassWidgets/",
          }
          missing = [k for k, v in required.items() if not any(n.startswith(v) for n in names)]
          if missing:
              print("❌ 发布包缺少依赖: " + ", ".join(missing))
              sys.exit(1)
          print("✅ 依赖齐全:", ", ".join(required))
          PY

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Generate changelog with git-cliff
        id: generate_changelog
        run: |
          git-cliff --tag v${{ env.VERSION }} > CHANGELOG.md
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          cat CHANGELOG.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            *.cwplugin
            *.zip
          body: ${{ env.CHANGELOG }}
          generate_release_notes: false
