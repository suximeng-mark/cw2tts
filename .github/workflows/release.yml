name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    # 目标平台是 Windows 课堂机，因此在 Windows runner 上打包：
    # winrt-* / pyttsx3 只有 Windows 发行文件，Linux runner 装不到它们，
    # 会导致发布包缺失对应引擎。
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Preflight dependency install (诊断)
        shell: pwsh
        run: |
          # 注意：不要用 `cmd 2>&1 | Tee-Object` —— 那样 $LASTEXITCODE
          # 取的是 Tee-Object 的退出码(0)，会把 pip 的真实失败掩盖成 success。
          # 这里用 `*>` 重定向，$LASTEXITCODE 才是 python 自己的。
          python -m pip install `
            "class-widgets-sdk" "edge-tts" "loguru" "onnxruntime" "pypinyin" `
            "winrt-runtime" "winrt-Windows.Foundation" `
            "winrt-Windows.Foundation.Collections" `
            "winrt-Windows.Media.SpeechSynthesis" `
            "winrt-Windows.Storage.Streams" `
            --target ./_preflight_libs `
            --no-python-version-warning --disable-pip-version-check `
            --quiet *> ./_preflight.log
          $code = $LASTEXITCODE
          "### Preflight pip install exit code: $code" >> $env:GITHUB_STEP_SUMMARY
          "```" >> $env:GITHUB_STEP_SUMMARY
          Get-Content ./_preflight.log -Tail 80 >> $env:GITHUB_STEP_SUMMARY
          "```" >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path ./_preflight_libs) {
            Remove-Item -Recurse -Force ./_preflight_libs
          }
          if ($code -ne 0) { exit $code }

      - name: Build plugin packages
        shell: pwsh
        run: |
          foreach ($p in @("_preflight_libs", "_preflight.log", "_pack.log", "_pack2.log")) {
            if (Test-Path $p) { Remove-Item -Recurse -Force $p }
          }
          # 用仓库自带的 build_pack.py 而非 cw-plugin-pack：
          # 官方打包器在 Windows runner 上打包失败（同一次运行中
          # 独立的 pip install --target 预演同样失败，说明与依赖清单相关）。
          python build_pack.py *> ./_pack.log
          $c1 = $LASTEXITCODE
          if ($c1 -eq 0) {
            python build_pack.py --format zip *> ./_pack2.log
            $c1 = $LASTEXITCODE
          }
          "### 打包退出码: $c1" >> $env:GITHUB_STEP_SUMMARY
          "```" >> $env:GITHUB_STEP_SUMMARY
          Get-Content ./_pack.log -Tail 120 >> $env:GITHUB_STEP_SUMMARY
          Get-Content ./_pack2.log -Tail 60 >> $env:GITHUB_STEP_SUMMARY
          "```" >> $env:GITHUB_STEP_SUMMARY
          if ($c1 -ne 0) { exit $c1 }

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Generate changelog with git-cliff
        id: generate_changelog
        run: |
          git-cliff --tag v${{ env.VERSION }} > CHANGELOG.md
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          cat CHANGELOG.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            *.cwplugin
            *.zip
          body: ${{ env.CHANGELOG }}
          generate_release_notes: false
