name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    # 目标平台是 Windows 课堂机，因此在 Windows runner 上打包：
    # winrt-* 只有 win_*.whl 发行文件，Linux runner 装不到，
    # 会导致发布包缺失该引擎。
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Preflight dependency install (诊断)
        shell: pwsh
        run: |
          # 直接调用 pip，不经 PowerShell 管道：管道会覆盖 $LASTEXITCODE，
          # 把真实失败伪装成成功。日志由 Python 侧写，此处只负责退出码。
          python -m pip install --target ./_preflight_libs `
            class-widgets-sdk edge-tts loguru onnxruntime pypinyin `
            winrt-runtime winrt-Windows.Foundation `
            winrt-Windows.Foundation.Collections `
            winrt-Windows.Media.SpeechSynthesis `
            winrt-Windows.Storage.Streams `
            --no-python-version-warning --disable-pip-version-check --quiet
          if ($LASTEXITCODE -ne 0) {
            Remove-Item -Recurse -Force ./_preflight_libs -ErrorAction SilentlyContinue
            exit $LASTEXITCODE
          }
          Remove-Item -Recurse -Force ./_preflight_libs

      - name: Build plugin packages
        shell: pwsh
        run: |
          # 清理任何残留（_build_pack.log 必须在列表内，否则会被 copy_source 打进包）
          foreach ($p in @("_preflight_libs", "_preflight.log", "_pack.log",
                            "_pack2.log", "_build_pack.log")) {
            if (Test-Path $p) { Remove-Item -Recurse -Force $p }
          }
          # 先落一个哨兵文件：若最终 artifact 里看不到它，说明脚本根本没启动
          "sentinel" | Out-File -FilePath ./_build_pack.log -Encoding utf8
          "cwd=$(Get-Location) py=$(python --version 2>&1)" | Out-File -FilePath ./_build_pack.log -Append -Encoding utf8

          $env:BUILD_PACK_LOG = "$PWD\_build_pack.log"
          # 日志与摘要全部由 build_pack.py 自身写入（Python 写文件，
          # 不经过 PowerShell 管道，避免编码与退出码问题）
          python build_pack.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build_pack.py --format zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            _build_pack.log
            _preflight.log
          retention-days: 7

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Generate changelog with git-cliff
        id: generate_changelog
        run: |
          git-cliff --tag v${{ env.VERSION }} > CHANGELOG.md
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          cat CHANGELOG.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            *.cwplugin
            *.zip
          body: ${{ env.CHANGELOG }}
          generate_release_notes: false
