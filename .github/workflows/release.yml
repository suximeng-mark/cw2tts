name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    # 目标平台是 Windows 课堂机，因此在 Windows runner 上打包：
    # winrt-* 只有 win_*.whl 发行文件，Linux runner 装不到，
    # 会导致发布包缺失该引擎。
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Preflight dependency install (诊断)
        shell: pwsh
        run: |
          # 原生命令的 stderr 在 ErrorActionPreference='Stop' 下会中断步骤
          $ErrorActionPreference = 'Continue'
          python -m pip install --target ./_preflight_libs `
            class-widgets-sdk edge-tts loguru onnxruntime pypinyin `
            winrt-runtime winrt-Windows.Foundation `
            winrt-Windows.Foundation.Collections `
            winrt-Windows.Media.SpeechSynthesis `
            winrt-Windows.Storage.Streams `
            --no-python-version-warning --disable-pip-version-check --quiet
          $code = $LASTEXITCODE
          if (Test-Path ./_preflight_libs) {
            Remove-Item -Recurse -Force ./_preflight_libs
          }
          if ($code -ne 0) { exit $code }

      - name: Build plugin packages
        shell: pwsh
        run: |
          # GitHub 的 pwsh 默认 $ErrorActionPreference='Stop'：
          # 原生命令往 stderr 写任何内容都会抛 NativeCommandError 并中断步骤，
          # 必须显式改为 Continue，否则会在脚本启动前就失败。
          $ErrorActionPreference = 'Continue'
          foreach ($p in @("_preflight_libs", "_preflight.log", "_pack.log",
                            "_pack2.log", "_build_pack.log")) {
            if (Test-Path $p) { Remove-Item -Recurse -Force $p }
          }
          $env:BUILD_PACK_LOG = "$PWD\_build_pack.log"
          "sentinel: cwd=$(Get-Location)" | Out-File -FilePath ./_build_pack.log -Encoding utf8
          # 必须用 Tee-Object 而不是 Out-File：
          # Out-File 会把 stdout 重定向到文件，Python 输出的 GitHub 工作流命令
          # （::error::）被一并吞掉，GitHub 看不到注解，
          # 日志也就无法经 check-runs API 匿名读取，排查时完全看不到原因。
          # Tee-Object 同时送往控制台与文件，且保留原生命令退出码。
          python build_pack.py 2>&1 | Tee-Object -FilePath ./_pack.log
          $c1 = $LASTEXITCODE
          if ($c1 -eq 0) {
            python build_pack.py --format zip 2>&1 | Tee-Object -FilePath ./_pack2.log
            $c1 = $LASTEXITCODE
          }
          "exit=$c1" | Out-File -FilePath ./_build_pack.log -Append -Encoding utf8
          if ($c1 -ne 0) {
            # 由 PowerShell 自身发出注解：Python 的 ::error:: 可能被管道吞掉，
            # 而本机无 gh CLI/token，runs/{id}/logs 与 artifact 下载均需认证，
            # check-runs annotations API 是唯一可匿名读取的通道。
            $err = Get-Content ./_pack.log -Raw -ErrorAction SilentlyContinue
            if (-not $err) { $err = Get-Content ./_build_pack.log -Raw -ErrorAction SilentlyContinue }
            if ($err) {
              $esc = $err.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
              Write-Host "::error title=build_pack failed::$esc"
            } else {
              Write-Host "::error title=build_pack failed::no log captured (exit $c1)"
            }
            exit $c1
          }

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            _build_pack.log
            _pack.log
            _pack2.log
            _preflight.log
            _publish.log
          retention-days: 7

      - name: Get version from tag
        id: get_version
        shell: pwsh
        run: |
          # 必须用 PowerShell 语法：runner 是 windows-latest，默认 shell 为 pwsh。
          # 之前写的 bash 展开 ${GITHUB_REF#refs/tags/v} 与 $GITHUB_ENV 在 pwsh 下
          # 都取不到值 —— VERSION 为空会让 git-cliff 无输出，Release 正文变空
          # （v1.1.0 / v1.1.1 均为此问题）。
          $tag = $env:GITHUB_REF -replace '^refs/tags/v', ''
          "VERSION=$tag" >> $env:GITHUB_ENV
          Write-Host "VERSION=$tag"

      - name: Publish to Plugin Plaza
        shell: pwsh
        env:
          # 在仓库 Settings → Secrets and variables → Actions 中添加
          # CWPT_TOKEN（发布令牌从 https://plaza.cw.rinlit.cn/console 获取）
          CWPT_TOKEN: ${{ secrets.CWPT_TOKEN }}
          # runner 控制台默认 cp1252，cw-plugin-publish 输出中文会抛
          # UnicodeEncodeError 并中止发布（v1.1.6 重跑即因此失败）。
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not $env:CWPT_TOKEN) {
            Write-Host "::warning title=publish skipped::未配置 CWPT_TOKEN，跳过插件广场发布"
            exit 0
          }

          # 防止 tag 与清单不一致，把错误版本推到广场
          $manifest = Get-Content ./cwplugin.json -Raw -Encoding utf8 | ConvertFrom-Json
          if ($manifest.version -ne $env:VERSION) {
            Write-Host "::error title=version mismatch::cwplugin.json=$($manifest.version)，tag=v$env:VERSION"
            exit 1
          }

          # 发布只上传元数据，README / 图标 / 安装包由广场从仓库与 Release 读取，
          # 因此必须在本步骤之前完成打包，并在此之后创建 Release。
          cw-plugin-publish --branch "${{ github.event.repository.default_branch }}" 2>&1 |
            Tee-Object -FilePath ./_publish.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $err = Get-Content ./_publish.log -Raw -ErrorAction SilentlyContinue
            if ($err) {
              $esc = $err.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
              Write-Host "::error title=cw-plugin-publish failed::$esc"
            } else {
              Write-Host "::error title=cw-plugin-publish failed::no log captured (exit $code)"
            }
            exit $code
          }

      - name: Generate changelog with git-cliff
        id: generate_changelog
        shell: pwsh
        run: |
          git-cliff --tag "v$env:VERSION" > CHANGELOG.md
          $cl = Get-Content ./CHANGELOG.md -Raw -Encoding utf8
          if ($cl) {
            "CHANGELOG<<CWEOF" >> $env:GITHUB_ENV
            $cl >> $env:GITHUB_ENV
            "CWEOF" >> $env:GITHUB_ENV
          } else {
            Write-Host "::warning title=changelog::git-cliff 未生成内容，Release 正文将为空"
          }

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            *.cwplugin
            *.zip
          body: ${{ env.CHANGELOG }}
          generate_release_notes: false
