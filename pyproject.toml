[project]
name = "com-su-tts"
version = "1.1.3"
description = "监听课表通知并自动语音播报，内置 Piper 本地离线朗读"
authors = [
    { name = "suximeng-mark" },
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "class-widgets-sdk",
    "edge-tts",
    "loguru",
    "onnxruntime",
    "pypinyin",
    # Windows 语音栈（WinRT）：此处刻意不加 sys_platform 标记。
    # 原因：cw-plugin-pack 在 CI 上执行 pip install --target libs/，
    # 加了 win32 标记会被 pip 跳过，导致发布包里缺少 winrt 引擎。
    # winrt-* 仅发布 win_*.whl（无 any.whl），因此 CI runner 必须是 windows-latest。
    # 运行时由 engines 按 sys.platform 守卫，非 Windows 不会启用。
    "winrt-runtime",
    "winrt-Windows.Foundation",
    "winrt-Windows.Foundation.Collections",
    "winrt-Windows.Media.SpeechSynthesis",
    "winrt-Windows.Storage.Streams",
]

[project.optional-dependencies]
# pyttsx3 是最后兜底引擎（非 Windows 平台用）。
# 它在 Windows 上会拉入 comtypes / pywin32（需本地构建），曾导致 CI 打包失败，
# 因此不放入必需依赖；Windows 语音已由 winrt 引擎覆盖。
# 需要时可手动安装：pip install pyttsx3
pyttsx3 = ["pyttsx3"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engines*", "qml*"]
