[project]
name = "com-su-tts"
version = "1.0.2"
description = "监听课表通知并自动语音播报，内置 Piper 本地离线朗读"
authors = [
    { name = "suximeng-mark" },
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "class-widgets-sdk",
    "edge-tts",
    "loguru",
    "onnxruntime",
    "pypinyin",
    "pyttsx3",
    # Windows 语音栈（WinRT）：此处刻意不加 sys_platform 标记。
    # 原因：cw-plugin-pack 在 CI(ubuntu) 上执行 pip install --target libs/，
    # 加了 win32 标记会被 pip 跳过，导致发布包里缺少 winrt 引擎。
    # winrt-* 仅发布 win_*.whl 与源码包，Linux CI 会自动回退源码包安装
    # （纯 Python 绑定生成，不依赖 Windows）。运行时由 engines 按 sys.platform 守卫。
    "winrt-runtime",
    "winrt-Windows.Foundation",
    "winrt-Windows.Foundation.Collections",
    "winrt-Windows.Media.SpeechSynthesis",
    "winrt-Windows.Storage.Streams",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engines*", "qml*"]
